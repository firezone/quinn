name: Validate Apple UDP source addresses

on:
  push:
    branches: [ci/validate-apple-source-address]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        features: [default, fast-apple-datapath]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Remove Homebrew Rustup proxies
        run: |
          if brew list --formula rustup >/dev/null 2>&1; then
            brew uninstall --ignore-dependencies rustup
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Test quinn-udp
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          if [[ "$FEATURES" == default ]]; then
            cargo test --locked -p quinn-udp
          else
            cargo test --locked -p quinn-udp --features "$FEATURES"
          fi
      - name: Verify source-address test detects the original bug
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          git fetch --depth 1 origin ef279010009563889f7f91aa728e7f4dcee4d61b
          git restore --source=ef279010009563889f7f91aa728e7f4dcee4d61b -- quinn-udp/src/unix.rs quinn-udp/src/apple_fast.rs
          args=(--locked -p quinn-udp --test tests)
          if [[ "$FEATURES" != default ]]; then args+=(--features "$FEATURES"); fi
          if cargo test "${args[@]}" basic_src_ip -- --exact > regression.log 2>&1; then
            cat regression.log
            echo 'The source-address test unexpectedly passed before the fix' >&2
            exit 1
          fi
          cat regression.log
          python3 - <<'PYTHON'
          from pathlib import Path
          output = Path('regression.log').read_text()
          assert 'basic_src_ip ... FAILED' in output
          assert 'received source does not match the requested source' in output
          assert '127.0.0.1' in output
          PYTHON
