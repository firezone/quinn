name: Validate Apple UDP source override

on:
  push:
    branches: [ci/validate-apple-source-address-regression]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        features: [default, fast-apple-datapath]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
      - name: Remove Homebrew Rustup proxies
        run: |
          if brew list --formula rustup >/dev/null 2>&1; then
            brew uninstall --ignore-dependencies rustup
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the source-address fix
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          args=(--locked -p quinn-udp)
          if [[ "$FEATURES" != default ]]; then args+=(--features "$FEATURES"); fi
          cargo test "${args[@]}"
      - name: Verify the Apple regression test detects the original bug
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          git restore --source=ef279010009563889f7f91aa728e7f4dcee4d61b -- quinn-udp/src/unix.rs quinn-udp/src/apple_fast.rs
          args=(--locked -p quinn-udp --test tests)
          if [[ "$FEATURES" != default ]]; then args+=(--features "$FEATURES"); fi
          if cargo test "${args[@]}" ipv4_source_address_override -- --exact > regression.log 2>&1; then
            cat regression.log
            echo 'The Apple source override test unexpectedly passed before the fix' >&2
            exit 1
          fi
          cat regression.log
          python3 - <<'PYTHON'
          from pathlib import Path
          output = Path('regression.log').read_text()
          assert 'ipv4_source_address_override ... FAILED' in output
          assert 'left: 127.0.0.1' in output
          PYTHON
